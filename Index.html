<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body { background: #0f1115; color: #e8eaed; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  #gate { width: 100%; max-width: 420px; padding: 32px; text-align: center; }
  #gate h1 { font-size: 22px; margin: 0 0 8px; }
  #gate p { color: #9aa1ad; font-size: 14px; margin: 0 0 24px; }
  #gate input[type=email] {
    width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 8px;
    border: 1px solid #2a2f3a; background: #171a21; color: #e8eaed; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; padding: 12px; font-size: 15px; font-weight: 600; border: none;
    border-radius: 8px; background: #6c8cff; color: #0b0e14; cursor: pointer;
  }
  #gate button:disabled { opacity: 0.5; cursor: not-allowed; }
  #error { color: #e87878; font-size: 13px; margin-top: 10px; min-height: 16px; }

  #viewer { display: none; position: fixed; inset: 0; }
  #viewer iframe { width: 100%; height: 100%; border: none; }
</style>

<div id="gate">
  <h1>Digital Asset Summit</h1>
  <p>Enter your email to view the sponsorship deck.</p>
  <input type="email" id="email" placeholder="you@company.com" autofocus>
  <button id="submitBtn">View the deck</button>
  <div id="error"></div>
</div>

<div id="viewer">
  <iframe id="deckFrame" allowfullscreen></iframe>
</div>

<script>
  const emailInput = document.getElementById('email');
  const submitBtn = document.getElementById('submitBtn');
  const errorDiv = document.getElementById('error');

  function submit() {
    const email = emailInput.value.trim();
    errorDiv.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Loading…';

    google.script.run
      .withSuccessHandler(function (embedUrl) {
        document.getElementById('deckFrame').src = embedUrl;
        document.getElementById('gate').style.display = 'none';
        document.getElementById('viewer').style.display = 'block';
      })
      .withFailureHandler(function (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'View the deck';
        errorDiv.textContent = (err && err.message) ? err.message : String(err);
      })
      .api_logViewAndGetEmbedUrl(email);
  }

  submitBtn.addEventListener('click', submit);
  emailInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submit();
  });
</script>
